busy_screen_file=/home/erik/Documents/github/bbs_single_connection_filter/bscf/templates/busy.ata
busy_screen_msg=Sorry! it looks like the Action 8 is currently busy right now. Please try again later

connect_screen_file=/home/erik/Documents/github/bbs_single_connection_filter/bscf/templates/connect.ata
