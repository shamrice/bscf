[BBSSingleConnectionFilter]
server_host=192.168.1.118
server_port=9502
server_proto=tcp
server_listen=2
server_timeout=900
server_reuse_address=1
server_input_timeout=900

ip_block_list=
ip_allow_list=

client_max_session_dur=2700
client_input_timeout_warning=260
client_input_timeout=300

enable_connect_prompt_filter=1
connect_ascii_code=155

connection_lock_file=/home/erik/Documents/github/bbs_single_connection_filter/bscf/conn.lock

destination_bbs_name=Action 8 BBS
destination_bbs_host=192.168.1.118
destination_bbs_port=9223
#destination_bbs_host=192.168.1.201
#destination_bbs_port=6502
destination_bbs_proto=tcp


dialup_enabled=1



[ModemConnectionHandler]
modem_com_port=/dev/ttyACM0
modem_baud_rate=300
modem_data_bits=8
modem_parity=none
modem_stop_bits=0
modem_handshake=rts
modem_init=ATZ

sleep_duration_on_failure=10
sleep_duration_on_connect=15

destination_bbs_host=127.0.0.1
destination_bbs_port=9223

destination_bbs_map=NE BBS|192.168.1.118:9223,Action 8 BBS|192.168.1.118:6502




[TemplateRenderer]
